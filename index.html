}

body {
background: var(–bg-0);
color: var(–text-1);
font-family: ‘Heebo’, system-ui, sans-serif;
direction: rtl;
overscroll-behavior: none;
-webkit-font-smoothing: antialiased;
}

.lat { font-family: ‘Inter’, system-ui, sans-serif; direction: ltr; display: inline-block; }

#stage {
position: relative;
width: 100%;
height: 100vh;
height: 100dvh;
overflow: hidden;
background:
radial-gradient(ellipse at top right, rgba(255,107,53,0.12), transparent 50%),
radial-gradient(ellipse at bottom left, rgba(0,217,192,0.08), transparent 50%),
var(–bg-0);
}

.slide {
position: absolute;
inset: 0;
opacity: 0;
pointer-events: none;
transition: opacity 0.5s ease-out;
overflow-y: auto;
overflow-x: hidden;
-webkit-overflow-scrolling: touch;
}
.slide.active { opacity: 1; pointer-events: auto; }
.slide.active .anim-up { animation: animUp 0.7s cubic-bezier(0.16,1,0.3,1) both; }
.slide.active .anim-fade { animation: animFade 0.9s ease-out both; }
.slide.active .anim-scale { animation: animScale 0.7s cubic-bezier(0.16,1,0.3,1) both; }

@keyframes animUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes animFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes animScale { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }

.frame {
min-height: 100%;
padding: var(–pad-y) var(–pad-x);
display: flex;
flex-direction: column;
gap: clamp(16px, 2.5vh, 28px);
position: relative;
}

.topbar {
position: absolute;
top: clamp(14px, 2.2vh, 24px);
left: var(–pad-x);
right: var(–pad-x);
display: flex;
justify-content: space-between;
align-items: center;
font-size: var(–fs-mono);
color: var(–text-3);
z-index: 5;
}
.topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: 0.02em; }
.bgu-logo {
width: 22px; height: 22px;
background: linear-gradient(135deg, var(–accent), var(–accent-2));
border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-family: ‘Inter’, sans-serif;
font-size: 9px;
font-weight: 800;
color: white;
letter-spacing: -0.5px;
}
.topbar .counter { font-family: ‘Inter’, monospace; direction: ltr; color: var(–text-2); }

.nav {
position: fixed;
bottom: clamp(14px, 2.2vh, 22px);
left: 50%;
transform: translateX(-50%);
z-index: 100;
background: rgba(18,18,26,0.85);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid var(–border);
border-radius: 100px;
padding: 6px;
display: flex;
align-items: center;
gap: 4px;
box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.nav button {
background: none; border: none; color: var(–text-1);
width: 36px; height: 36px;
cursor: pointer;
display: flex; align-items: center; justify-content: center;
border-radius: 50%;
transition: background 0.2s;
}
.nav button:hover:not(:disabled) { background: var(–surface); }
.nav button:disabled { opacity: 0.25; cursor: not-allowed; }
.nav .dots { display: flex; gap: 4px; padding: 0 6px; align-items: center; flex-wrap: wrap; max-width: 65vw; }
.nav .dot {
width: 5px; height: 5px;
background: var(–text-3);
border: none; padding: 0; cursor: pointer;
border-radius: 50%;
transition: all 0.3s;
flex-shrink: 0;
}
.nav .dot:hover { background: var(–text-2); }
.nav .dot.active {
width: 18px;
border-radius: 3px;
background: var(–accent);
box-shadow: 0 0 10px var(–accent-glow);
}
@media (max-width: 480px) {
.nav .dot { width: 4px; height: 4px; }
.nav .dot.active { width: 14px; }
.nav .dots { gap: 3px; padding: 0 4px; }
}

/* Hour Progress Bar */
.hour-bar {
position: fixed;
top: 0; left: 0; right: 0;
height: 3px;
background: rgba(255,255,255,0.05);
z-index: 200;
pointer-events: none;
}
.hour-bar .fill {
height: 100%;
background: linear-gradient(90deg, var(–accent), var(–accent-2));
width: 0%;
transition: width 0.3s ease-out;
box-shadow: 0 0 10px var(–accent-glow);
}

h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font-family: inherit; }
strong { font-weight: 700; color: var(–text-0); }
em { font-style: italic; color: var(–accent-2); }

.label {
display: inline-flex;
align-items: center;
gap: 8px;
padding: 5px 12px;
background: var(–surface);
border: 1px solid var(–border);
border-radius: 100px;
font-size: var(–fs-mono);
color: var(–text-2);
text-transform: uppercase;
letter-spacing: 0.08em;
font-weight: 500;
}
.label .ldot {
width: 5px; height: 5px;
background: var(–accent);
border-radius: 50%;
animation: pulse 2s ease-in-out infinite;
}

.source {
font-family: ‘Inter’, monospace;
font-size: 0.68rem;
color: var(–text-3);
direction: ltr;
text-align: left;
line-height: 1.5;
border-top: 1px solid var(–border);
padding-top: 8px;
margin-top: auto;
}
.source a { color: var(–text-2); text-decoration: none; border-bottom: 1px dotted var(–text-3); }
.source a:hover { color: var(–accent); }
.source-tag {
display: inline-block;
padding: 2px 6px;
background: var(–surface);
border-radius: 4px;
color: var(–text-2);
margin-right: 4px;
}

.accent-grad {
background: linear-gradient(135deg, var(–accent), var(–accent-2));
-webkit-background-clip: text;
background-clip: text;
color: transparent;
display: inline-block;
}

/* SLIDE 1: HERO */
.s1 .frame { justify-content: space-between; }
.s1 .grid {
display: grid;
grid-template-columns: auto 1fr;
gap: clamp(20px, 4vw, 50px);
align-items: center;
flex: 1;
}
@media (max-width: 700px) {
.s1 .grid { grid-template-columns: 1fr; gap: 24px; text-align: right; }
}
.s1 .photo-wrap {
position: relative;
width: clamp(160px, 22vw, 280px);
height: clamp(160px, 22vw, 280px);
border-radius: 50%;
overflow: hidden;
border: 3px solid rgba(255,107,53,0.3);
box-shadow: 0 20px 60px rgba(255,107,53,0.2), 0 0 0 6px rgba(255,107,53,0.05);
}
.s1 .photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
.s1 h1 {
font-size: var(–fs-hero);
font-weight: 900;
line-height: 0.9;
letter-spacing: -0.04em;
color: var(–text-0);
}
.s1 .subtitle {
font-size: clamp(1rem, 2vw, 1.3rem);
color: var(–text-2);
max-width: 600px;
line-height: 1.6;
margin-top: 18px;
}
.s1 .meta-row {
display: flex; flex-wrap: wrap;
gap: clamp(12px, 2.5vw, 24px);
align-items: center;
font-size: var(–fs-small);
color: var(–text-2);
}
.s1 .meta-row .item { display: flex; align-items: center; gap: 8px; }
.s1 .meta-row .item-dot { width: 4px; height: 4px; background: var(–text-3); border-radius: 50%; }
.s1 .name-tag {
display: inline-flex;
align-items: center;
gap: 8px;
padding: 5px 14px;
background: rgba(255,107,53,0.12);
border: 1px solid rgba(255,107,53,0.3);
border-radius: 100px;
font-size: var(–fs-small);
color: var(–accent-2);
margin-bottom: 12px;
font-weight: 600;
}

/* AGENDA SLIDE */
.agenda h2 { font-size: var(–fs-h1); color: var(–text-0); }
.agenda h2 .accent { color: var(–accent); }
.agenda .lead { font-size: var(–fs-body); color: var(–text-2); line-height: 1.7; max-width: 700px; margin-top: 14px; }
.agenda-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: clamp(12px, 2vw, 20px);
flex: 1;
margin-top: 8px;
}
@media (max-width: 800px) { .agenda-grid { grid-template-columns: 1fr; } }
.act-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
padding: clamp(18px, 2.5vw, 26px);
display: flex; flex-direction: column;
gap: 10px;
position: relative;
overflow: hidden;
}
.act-card.act1 { border-top: 3px solid var(–accent-3); }
.act-card.act2 { border-top: 3px solid var(–accent); background: linear-gradient(135deg, rgba(255,107,53,0.06), rgba(255,107,53,0.01)); }
.act-card.act3 { border-top: 3px solid var(–accent-2); }
.act-card .act-num {
font-family: ‘Inter’, monospace;
font-size: 0.7rem;
color: var(–text-3);
text-transform: uppercase;
letter-spacing: 0.1em;
direction: ltr;
}
.act-card .act-time {
font-family: ‘Inter’, monospace;
font-size: 0.68rem;
color: var(–text-3);
direction: ltr;
margin-top: -4px;
}
.act-card .act-title { font-size: var(–fs-h3); color: var(–text-0); font-weight: 700; line-height: 1.25; }
.act-card .act-desc { font-size: var(–fs-small); color: var(–text-2); line-height: 1.55; }
.act-card ul { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.act-card li { font-size: 0.78rem; color: var(–text-2); padding-right: 14px; position: relative; }
.act-card li::before { content: ‘·’; position: absolute; right: 4px; color: var(–accent); font-weight: 700; }

/* JOURNEY (CAREER TIMELINE) */
.journey h2 { font-size: var(–fs-h1); color: var(–text-0); }
.journey h2 .accent { color: var(–accent); }
.journey .lead { font-size: var(–fs-body); color: var(–text-2); line-height: 1.7; margin-top: 14px; max-width: 720px; }
.timeline {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: clamp(10px, 1.5vw, 16px);
margin-top: clamp(16px, 2.5vh, 28px);
}
@media (max-width: 800px) { .timeline { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 460px) { .timeline { grid-template-columns: 1fr; } }
.stop {
background: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
padding: clamp(12px, 2vw, 18px);
display: flex; flex-direction: column; gap: 8px;
position: relative;
transition: all 0.3s;
min-height: 140px;
}
.stop:hover { border-color: var(–border-2); transform: translateY(-2px); }
.stop.current {
background: linear-gradient(135deg, rgba(255,107,53,0.1), rgba(255,182,39,0.04));
border-color: rgba(255,107,53,0.3);
}
.stop.next {
background: linear-gradient(135deg, rgba(0,217,192,0.08), rgba(0,217,192,0.02));
border-color: rgba(0,217,192,0.25);
}
.stop-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.stop .years { font-family: ‘Inter’, monospace; font-size: 0.7rem; color: var(–text-3); direction: ltr; font-weight: 600; }
.stop.current .years { color: var(–accent); }
.stop.next .years { color: var(–accent-3); }
.stop .role { font-size: var(–fs-small); color: var(–text-0); font-weight: 700; line-height: 1.3; margin-top: 2px; }
.stop .company { font-size: var(–fs-small); color: var(–text-2); }
.stop .desc { font-size: 0.76rem; color: var(–text-3); line-height: 1.45; margin-top: 4px; }
.stop .badge-tag {
font-family: ‘Inter’, monospace;
font-size: 0.58rem;
padding: 2px 6px;
background: var(–surface);
border: 1px solid var(–border);
border-radius: 100px;
color: var(–text-3);
text-transform: uppercase;
letter-spacing: 0.08em;
direction: ltr;
flex-shrink: 0;
}
.stop.current .badge-tag { background: rgba(255,107,53,0.15); color: var(–accent-2); border-color: rgba(255,107,53,0.3); }
.stop.next .badge-tag { background: rgba(0,217,192,0.15); color: var(–accent-3); border-color: rgba(0,217,192,0.3); }

/* WHY IE */
.why-ie h2 { font-size: var(–fs-h1); color: var(–text-0); }
.why-ie h2 .accent { color: var(–accent); }
.why-ie .grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: clamp(10px, 1.8vw, 18px);
flex: 1;
}
@media (max-width: 800px) { .why-ie .grid { grid-template-columns: 1fr; } }
.why-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
padding: clamp(18px, 2.2vw, 26px);
display: flex; flex-direction: column; gap: 10px;
}
.why-card .num { font-family: ‘Inter’, monospace; font-size: 1.9rem; font-weight: 900; color: var(–accent); line-height: 1; direction: ltr; }
.why-card .t { font-size: var(–fs-h3); color: var(–text-0); font-weight: 700; line-height: 1.2; }
.why-card .d { font-size: var(–fs-small); color: var(–text-2); line-height: 1.6; }

/* OLD vs NEW comparison */
.vs-slide h2 { font-size: var(–fs-h1); color: var(–text-0); }
.vs-slide h2 em { color: var(–text-3); font-style: italic; font-weight: 400; font-size: 0.7em; }
.vs-slide h2 .accent { color: var(–accent); }
.vs-slide .lead { font-size: var(–fs-body); color: var(–text-2); line-height: 1.7; max-width: 720px; margin-top: 12px; }
.vs-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: clamp(12px, 2vw, 22px);
flex: 1;
align-items: stretch;
}
@media (max-width: 800px) { .vs-grid { grid-template-columns: 1fr; } }
.vs-col {
background: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
padding: clamp(16px, 2.2vw, 24px);
display: flex; flex-direction: column;
position: relative;
}
.vs-col.old { opacity: 0.85; border-left: 3px solid var(–text-3); }
.vs-col.new {
background: linear-gradient(135deg, rgba(255,107,53,0.08), rgba(255,107,53,0.02));
border-color: rgba(255,107,53,0.3);
border-left: 3px solid var(–accent);
}
.vs-col-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(–border); }
.vs-col-head h3 { font-size: var(–fs-h3); color: var(–text-0); }
.vs-col.new .vs-col-head h3 { color: var(–accent-2); }
.vs-col .year-badge {
font-family: ‘Inter’, monospace;
font-size: 0.7rem;
padding: 3px 8px;
background: var(–surface);
border-radius: 100px;
color: var(–text-3);
text-transform: uppercase;
direction: ltr;
letter-spacing: 0.08em;
}
.vs-col.new .year-badge { background: rgba(255,107,53,0.15); color: var(–accent-2); }
.vs-col ul { display: flex; flex-direction: column; gap: 8px; }
.vs-col li {
font-size: var(–fs-small);
color: var(–text-1);
padding: 8px 0;
border-bottom: 1px solid rgba(255,255,255,0.04);
line-height: 1.5;
display: flex;
align-items: flex-start;
gap: 8px;
}
.vs-col li:last-child { border: none; }
.vs-col li::before { content: ‘’; flex-shrink: 0; width: 6px; height: 6px; background: var(–text-3); border-radius: 50%; margin-top: 7px; }
.vs-col.new li::before { background: var(–accent); }
.vs-col.old li { color: var(–text-2); }

/* STATS */
.stats h2 { font-size: var(–fs-h1); color: var(–text-0); }
.stats h2 .accent { color: var(–accent); }
.stats .grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: clamp(10px, 1.8vw, 18px);
flex: 1;
}
@media (max-width: 700px) { .stats .grid { grid-template-columns: 1fr; } }
.stat-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
padding: clamp(18px, 2.5vw, 28px);
display: flex; flex-direction: column;
gap: 10px;
transition: all 0.3s;
position: relative; overflow: hidden;
}
.stat-card::before {
content: ‘’;
position: absolute;
top: 0; left: 0;
width: 3px; height: 0;
background: var(–accent);
transition: height 0.4s;
}
.stat-card:hover { border-color: var(–border-2); transform: translateY(-2px); }
.stat-card:hover::before { height: 100%; }
.stat-num { font-size: clamp(2rem, 4.5vw, 3.2rem); font-weight: 900; line-height: 1; color: var(–text-0); letter-spacing: -0.04em; }
.stat-num .unit { font-size: 0.5em; color: var(–accent); font-weight: 700; margin-right: 4px; }
.stat-label { font-size: var(–fs-body); color: var(–text-1); font-weight: 600; }
.stat-desc { font-size: var(–fs-small); color: var(–text-2); line-height: 1.6; }

/* CHART SLIDE */
.data-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
padding: clamp(18px, 2.5vw, 28px);
display: flex; flex-direction: column;
gap: 14px;
min-height: 300px;
}
.data-card .chart-title { font-size: var(–fs-small); color: var(–text-2); font-weight: 600; }
.data-card .chart-subtitle { font-size: 0.76rem; color: var(–text-3); margin-top: 2px; }
.data-card svg { width: 100%; height: auto; max-height: 260px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: var(–fs-small); color: var(–text-2); }
.legend .item { display: flex; align-items: center; gap: 8px; }
.legend .swatch { width: 14px; height: 3px; border-radius: 2px; }

.chart-slide .grid {
display: grid;
grid-template-columns: 1fr 1.3fr;
gap: clamp(20px, 3.5vw, 48px);
flex: 1;
align-items: center;
}
@media (max-width: 900px) { .chart-slide .grid { grid-template-columns: 1fr; gap: 22px; } }
.chart-slide .left h2 { font-size: var(–fs-h1); color: var(–text-0); margin-top: 14px; margin-bottom: 18px; }
.chart-slide .left h2 .accent { color: var(–accent); }
.chart-slide .left p { font-size: var(–fs-body); color: var(–text-2); line-height: 1.7; }

/* JOBS (junior + senior) */
.jobs-slide h2 { font-size: var(–fs-h1); color: var(–text-0); }
.jobs-slide h2 em { color: var(–text-3); font-style: normal; font-weight: 400; font-size: 0.7em; }
.jobs-slide h2 .accent { color: var(–accent); }
.jobs-slide .lead { font-size: var(–fs-body); color: var(–text-2); line-height: 1.7; max-width: 720px; margin-top: 12px; }
.jobs-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: clamp(10px, 1.5vw, 14px);
flex: 1;
}
@media (max-width: 700px) { .jobs-grid { grid-template-columns: 1fr; } }
.job-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: var(–radius);
padding: clamp(12px, 1.8vw, 18px);
display: flex; flex-direction: column;
gap: 6px;
transition: all 0.3s;
position: relative;
}
.job-card:hover { border-color: rgba(255,107,53,0.3); transform: translateY(-2px); }
.job-card .job-tag {

padding-top: 10px;
border-bottom: 2px solid #f0f0f0;
padding-bottom: 12px;
}
.article-clip .ctech-logo {
background: #D52B1E;
color: white;
font-family: ‘Inter’, sans-serif;
font-size: 0.7rem;
font-weight: 800;
padding: 4px 10px;
border-radius: 3px;
letter-spacing: 0.05em;
}
.article-clip .ctech-section {
color: #D52B1E;
font-size: 0.78rem;
font-weight: 700;
letter-spacing: 0.04em;
}
.article-clip .ctech-date {
margin-right: auto;
color: #888;
font-size: 0.75rem;
direction: ltr;
}
.article-clip .head1 {
font-size: clamp(1.1rem, 2.1vw, 1.55rem);
color: #111;
font-weight: 800;
line-height: 1.25;
letter-spacing: -0.01em;
}
.article-clip .head1 em { color: #D52B1E; font-style: normal; }
.article-clip .head2 {
font-size: clamp(0.85rem, 1.3vw, 0.96rem);
color: #444;
line-height: 1.55;
font-weight: 500;
}
.article-clip .author {
font-size: 0.75rem;
color: #888;
border-top: 1px solid #eee;
padding-top: 10px;
margin-top: auto;
}
.article-clip .author strong { color: #333; }
.article-side {
display: flex; flex-direction: column;
gap: 14px;
}
.article-pull {
background: linear-gradient(135deg, rgba(255,107,53,0.1), rgba(255,107,53,0.02));
border: 1px solid rgba(255,107,53,0.3);
border-radius: var(–radius);
padding: clamp(16px, 2vw, 22px);
display: flex; flex-direction: column; gap: 10px;
position: relative;
}
.article-pull::before {
content: ‘”’;
position: absolute;
top: -10px;
right: 18px;
font-size: 5rem;
line-height: 1;
color: var(–accent);
opacity: 0.25;
font-family: ‘Inter’, serif;
}
.article-pull .pull-text {
font-size: clamp(0.95rem, 1.5vw, 1.1rem);
color: var(–text-0);
line-height: 1.5;
font-weight: 600;
z-index: 1;
position: relative;
}
.article-pull .pull-text em { color: var(–accent-2); font-style: normal; }
.article-pull .pull-source {
font-size: 0.78rem;
color: var(–text-2);
border-top: 1px solid var(–border);
padding-top: 10px;
}
.article-pull .pull-source strong { color: var(–text-1); }
.article-takeaway {
background: rgba(0,217,192,0.08);
border: 1px solid rgba(0,217,192,0.25);
border-radius: var(–radius-sm);
padding: 14px 16px;
font-size: var(–fs-small);
color: var(–text-1);
line-height: 1.6;
}
.article-takeaway strong { color: var(–accent-3); }
.article-link {
font-family: ‘Inter’, monospace;
font-size: 0.7rem;
color: var(–text-3);
direction: ltr;
text-align: left;
border-top: 1px solid var(–border);
padding-top: 8px;
}
.article-link a { color: var(–text-2); text-decoration: none; border-bottom: 1px dotted var(–text-3); }
.article-link a:hover { color: var(–accent); }

/* THANKS */
.thanks-slide .frame { align-items: center; justify-content: center; text-align: center; }
.thanks-slide .photo-wrap-sm { width: clamp(90px, 12vw, 140px); height: clamp(90px, 12vw, 140px); border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,107,53,0.4); box-shadow: 0 12px 40px rgba(255,107,53,0.25); margin-bottom: 20px; }
.thanks-slide .photo-wrap-sm img { width: 100%; height: 100%; object-fit: cover; }
.thanks-slide h1 { font-size: var(–fs-hero); font-weight: 900; line-height: 0.9; letter-spacing: -0.04em; color: var(–text-0); }
.thanks-slide h1 .accent { background: linear-gradient(135deg, var(–accent), var(–accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.thanks-slide .lead { font-size: clamp(1rem, 2vw, 1.3rem); color: var(–text-2); max-width: 620px; line-height: 1.6; margin-top: 16px; }
.contact-cards {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: clamp(8px, 1.4vw, 14px);
margin-top: 28px;
width: 100%;
max-width: 720px;
}
@media (max-width: 600px) { .contact-cards { grid-template-columns: 1fr; } }
.contact-card { background: var(–surface); border: 1px solid var(–border); border-radius: var(–radius); padding: 14px; text-align: center; transition: all 0.3s; text-decoration: none; color: inherit; }
.contact-card:hover { border-color: rgba(255,107,53,0.4); background: rgba(255,107,53,0.05); transform: translateY(-2px); }
.contact-card .ic { width: 28px; height: 28px; margin: 0 auto 6px; color: var(–accent); }
.contact-card .lbl { font-family: ‘Inter’, monospace; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(–text-3); margin-bottom: 4px; direction: ltr; }
.contact-card .val { font-size: 0.84rem; color: var(–text-1); direction: ltr; font-weight: 500; word-break: break-all; }
</style>

</head>

/* THREE.JS - Network animation */
let threeRenderer, threeScene, threeCamera, threeFrame;
function initThree() {
  const host = document.getElementById('threeHost');
  if (!host || threeRenderer || typeof THREE === 'undefined') return;

  const w = host.clientWidth;
  const h = host.clientHeight;

  threeScene = new THREE.Scene();
  threeCamera = new THREE.PerspectiveCamera(55, w / h, 0.1, 1000);
  threeCamera.position.z = 18;

  threeRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  threeRenderer.setSize(w, h);
  threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  host.appendChild(threeRenderer.domElement);

  // Group of nodes representing a system
  const nodes = [];
  const links = [];

  // Central YOU node (orange)
  const youGeo = new THREE.SphereGeometry(0.5, 24, 24);
  const youMat = new THREE.MeshBasicMaterial({ color: 0xFF6B35 });
  const youNode = new THREE.Mesh(youGeo, youMat);
  threeScene.add(youNode);
  nodes.push({ mesh: youNode, type: 'you', pos: new THREE.Vector3(0, 0, 0) });

  // Add aura around YOU
  const auraGeo = new THREE.SphereGeometry(0.8, 24, 24);
  const auraMat = new THREE.MeshBasicMaterial({ color: 0xFF6B35, transparent: true, opacity: 0.15 });
  const aura = new THREE.Mesh(auraGeo, auraMat);
  threeScene.add(aura);

  // Human nodes (yellow)
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2;
    const x = Math.cos(angle) * 5;
    const y = Math.sin(angle) * 5;
    const z = (Math.random() - 0.5) * 3;
    const geo = new THREE.SphereGeometry(0.3, 16, 16);
    const mat = new THREE.MeshBasicMaterial({ color: 0xFFB627 });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    threeScene.add(m);
    nodes.push({ mesh: m, type: 'human', pos: m.position.clone() });
  }

  // AI nodes (teal)
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 + 0.4;
    const x = Math.cos(angle) * 9;
    const y = Math.sin(angle) * 9;
    const z = (Math.random() - 0.5) * 5;
    const geo = new THREE.OctahedronGeometry(0.25, 0);
    const mat = new THREE.MeshBasicMaterial({ color: 0x00D9C0 });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    threeScene.add(m);
    nodes.push({ mesh: m, type: 'ai', pos: m.position.clone() });
  }

  // Connect YOU to all
  for (let i = 1; i < nodes.length; i++) {
    const points = [nodes[0].pos.clone(), nodes[i].pos.clone()];
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const color = nodes[i].type === 'human' ? 0xFFB627 : 0x00D9C0;
    const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.3 });
    const line = new THREE.Line(geo, mat);
    threeScene.add(line);
    links.push(line);
  }

  let t = 0;
  function animate() {
    threeFrame = requestAnimationFrame(animate);
    t += 0.005;
    threeScene.rotation.y = Math.sin(t * 0.4) * 0.4;
    threeScene.rotation.x = Math.cos(t * 0.3) * 0.15;
    aura.scale.setScalar(1 + Math.sin(t * 2) * 0.15);
    nodes.forEach((n, i) => {
      if (i > 0) {
        n.mesh.position.x = n.pos.x + Math.sin(t + i) * 0.3;
        n.mesh.position.y = n.pos.y + Math.cos(t + i * 1.3) * 0.3;
        if (n.type === 'ai') {
          n.mesh.rotation.x = t * 2;
          n.mesh.rotation.y = t * 1.5;
        }
      }
    });
    threeRenderer.render(threeScene, threeCamera);
  }
  animate();

  // Resize handler
  const ro = new ResizeObserver(() => {
    if (!threeRenderer) return;
    const nw = host.clientWidth, nh = host.clientHeight;
    threeRenderer.setSize(nw, nh);
    threeCamera.aspect = nw / nh;
    threeCamera.updateProjectionMatrix();
  });
  ro.observe(host);
}

function destroyThree() {
  if (threeFrame) cancelAnimationFrame(threeFrame);
  if (threeRenderer) {
    threeRenderer.dispose();
    threeRenderer.domElement.remove();
    threeRenderer = null;
  }
  threeScene = null;
}

/* HOUR PROGRESS */
function startHourTimer() {
  if (lectureStart) return;
  lectureStart = Date.now();
  setInterval(() => {
    const elapsed = (Date.now() - lectureStart) / 1000 / 60; // minutes
    const pct = Math.min((elapsed / 60) * 100, 100);
    if (hourFill) hourFill.style.width = pct + '%';
  }, 1000);
}

const SLIDES = [slide1, slide2, slide3, slide4, slide5, slide6, slide7, slide8, slide9, slide10, slide11, slideArticle, slide12, slide13, slide14, slide15, slide16, slide17, slide18, slide19];

function render() {
  stage.innerHTML = '';
  SLIDES.forEach((sl, i) => {
    const div = document.createElement('div');
    div.className = 'slide s' + (i+1);
    div.id = 'slide-' + i;
    if (i === current) div.classList.add('active');
    div.innerHTML = sl();
    stage.appendChild(div);
  });

  dots.innerHTML = '';
  SLIDES.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'dot' + (i === current ? ' active' : '');
    d.onclick = () => go(i);
    dots.appendChild(d);
  });

  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === SLIDES.length - 1;

  // Init 3D on systems view slide (slide13, index 13 after article insertion)
  if (current === 13) {
    setTimeout(initThree, 100);
  } else {
    destroyThree();
  }

  // Skill card interactions on slide 15 (index 15)
  if (current === 15) {
    setTimeout(() => {
      const cards = document.querySelectorAll('.skill-card');
      cards.forEach(c => {
        c.onclick = () => {
          cards.forEach(x => x.classList.remove('active'));
          c.classList.add('active');
        };
      });
    }, 100);
  }
}

function go(i) {
  current = Math.max(0, Math.min(SLIDES.length - 1, i));
  render();
  startHourTimer();
}

prevBtn.onclick = () => go(current - 1);
nextBtn.onclick = () => go(current + 1);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); go(current + 1); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); go(current - 1); }
  if (e.key === 'Home') go(0);
  if (e.key === 'End') go(SLIDES.length - 1);
});

let touchX = 0;
stage.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
stage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) {
    if (dx > 0) go(current + 1);  // swipe right = next (RTL)
    else go(current - 1);
  }
}, { passive: true });

render();

</script>
