}

body {
background: var(–bg-0);
color: var(–text-1);
font-family: ‘Heebo’, system-ui, sans-serif;
direction: rtl;
overscroll-behavior: none;
-webkit-font-smoothing: antialiased;
}

.lat { font-family: ‘Inter’, system-ui, sans-serif; direction: ltr; display: inline-block; }

#stage {
position: relative;
width: 100%;
height: 100vh;
height: 100dvh;
overflow: hidden;
background:
radial-gradient(ellipse at top right, rgba(255,107,53,0.12), transparent 50%),
radial-gradient(ellipse at bottom left, rgba(0,217,192,0.08), transparent 50%),
var(–bg-0);
}

.slide {
position: absolute;
inset: 0;
opacity: 0;
pointer-events: none;
transition: opacity 0.5s ease-out;
overflow-y: auto;
overflow-x: hidden;
-webkit-overflow-scrolling: touch;
}
.slide.active { opacity: 1; pointer-events: auto; }
.slide.active .anim-up { animation: animUp 0.7s cubic-bezier(0.16,1,0.3,1) both; }
.slide.active .anim-fade { animation: animFade 0.9s ease-out both; }
.slide.active .anim-scale { animation: animScale 0.7s cubic-bezier(0.16,1,0.3,1) both; }

@keyframes animUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes animFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes animScale { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }

.frame {
min-height: 100%;
padding: var(–pad-y) var(–pad-x);
display: flex;
flex-direction: column;
gap: clamp(20px, 3vh, 32px);
position: relative;
}

.topbar {
position: absolute;
top: clamp(16px, 2.5vh, 28px);
left: var(–pad-x);
right: var(–pad-x);
display: flex;
justify-content: space-between;
align-items: center;
font-size: var(–fs-mono);
color: var(–text-3);
z-index: 5;
}
.topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: 0.02em; }
.bgu-logo {
width: 22px; height: 22px;
background: linear-gradient(135deg, var(–accent), var(–accent-2));
border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-family: ‘Inter’, sans-serif;
font-size: 9px;
font-weight: 800;
color: white;
letter-spacing: -0.5px;
}
.topbar .counter { font-family: ‘Inter’, monospace; direction: ltr; color: var(–text-2); }

.nav {
position: fixed;
bottom: clamp(16px, 2.5vh, 24px);
left: 50%;
transform: translateX(-50%);
z-index: 100;
background: rgba(18,18,26,0.85);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid var(–border);
border-radius: 100px;
padding: 6px;
display: flex;
align-items: center;
gap: 4px;
box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.nav button {
background: none; border: none; color: var(–text-1);
width: 38px; height: 38px;
cursor: pointer;
display: flex; align-items: center; justify-content: center;
border-radius: 50%;
transition: background 0.2s;
}
.nav button:hover:not(:disabled) { background: var(–surface); }
.nav button:disabled { opacity: 0.25; cursor: not-allowed; }
.nav .dots { display: flex; gap: 5px; padding: 0 8px; align-items: center; flex-wrap: wrap; max-width: 60vw; }
.nav .dot {
width: 6px; height: 6px;
background: var(–text-3);
border: none; padding: 0; cursor: pointer;
border-radius: 50%;
transition: all 0.3s;
flex-shrink: 0;
}
.nav .dot:hover { background: var(–text-2); }
.nav .dot.active {
width: 22px;
border-radius: 3px;
background: var(–accent);
box-shadow: 0 0 10px var(–accent-glow);
}
@media (max-width: 480px) {
.nav .dot { width: 5px; height: 5px; }
.nav .dot.active { width: 16px; }
.nav .dots { gap: 4px; padding: 0 5px; }
}

h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font-family: inherit; }

/* SLIDE — 3D */

.three-tag {

/* SLIDE 4 — DATA: AI shift */
const SKILL_CHANGE = [
{ y: '2020', v: 57 },
{ y: '2023', v: 44 },
{ y: '2025', v: 39 },
{ y: '2030*', v: 39 },
];
function buildSkillChart() {
const W = 600, H = 280;
const pad = { t: 30, r: 30, b: 40, l: 50 };
const innerW = W - pad.l - pad.r;
const innerH = H - pad.t - pad.b;
const xStep = innerW / (SKILL_CHANGE.length - 1);
const yScale = v => pad.t + innerH - (v / 70) * innerH;
const xAt = i => pad.l + i * xStep;
const linePath = SKILL_CHANGE.map((d,i) => `${i===0?'M':'L'} ${xAt(i)} ${yScale(d.v)}`).join(' ');
const areaPath = `${linePath} L ${xAt(SKILL_CHANGE.length-1)} ${pad.t+innerH} L ${pad.l} ${pad.t+innerH} Z`;
const yTicks = [0, 25, 50, 70];

return `
<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
<defs>
<linearGradient id="grad-skill" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#FF6B35" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
</linearGradient>
</defs>
${yTicks.map(t => `<line x1="${pad.l}" x2="${W-pad.r}" y1="${yScale(t)}" y2="${yScale(t)}" stroke="rgba(255,255,255,0.08)" stroke-dasharray="2 4"/>`).join('')}
${yTicks.map(t => `<text x="${pad.l-10}" y="${yScale(t)+4}" text-anchor="end" fill="#6B6B7B" font-family="Inter" font-size="11">${t}%</text>`).join('')}
${SKILL_CHANGE.map((d,i) => `<text x="${xAt(i)}" y="${H-pad.b+22}" text-anchor="middle" fill="#A0A0AE" font-family="Inter" font-size="12" font-weight="600">${d.y}</text>`).join('')}
<path d="${areaPath}" fill="url(#grad-skill)"/>
<path d="${linePath}" fill="none" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
${SKILL_CHANGE.map((d,i) => `
<circle cx="${xAt(i)}" cy="${yScale(d.v)}" r="5" fill="#0A0A0F" stroke="#FF6B35" stroke-width="2.5"/>
<text x="${xAt(i)}" y="${yScale(d.v)-14}" text-anchor="middle" fill="#FFFFFF" font-family="Inter" font-size="13" font-weight="700">${d.v}%</text>
`).join('')}
</svg>
`;
}

const SLIDES = [slide1, slide2, slide3, slideJobs, slide4, slide5, slide6, slide7, slide8, slide9, slide10, slide11, slide12];

const stage = document.getElementById('stage');
SLIDES.forEach((fn, i) => {
const div = document.createElement('div');
div.className = 'slide';
div.id = 'slide-' + i;
div.innerHTML = fn();
stage.appendChild(div);
});

const dots = document.getElementById('dots');
SLIDES.forEach((_, i) => {
const b = document.createElement('button');
b.className = 'dot';
b.dataset.i = i;
b.addEventListener('click', () => go(i));
dots.appendChild(b);
});

let current = 0;
function go(n) {
n = Math.max(0, Math.min(SLIDES.length - 1, n));
document.querySelectorAll('.slide').forEach((s, i) => {
s.classList.toggle('active', i === n);
if (i === n) s.scrollTop = 0;
});
document.querySelectorAll('.dots .dot').forEach((d, i) => d.classList.toggle('active', i === n));
document.getElementById('prev').disabled = n === 0;
document.getElementById('next').disabled = n === SLIDES.length - 1;
current = n;

if (n === 8) initThree();
}

document.getElementById('prev').addEventListener('click', () => go(current - 1));
document.getElementById('next').addEventListener('click', () => go(current + 1));
window.addEventListener('keydown', (e) => {
if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
if (e.key === 'ArrowLeft' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(current + 1); }
if (e.key === 'ArrowRight' || e.key === 'PageUp') { e.preventDefault(); go(current - 1); }
});

let touchStartX = 0, touchStartY = 0;
stage.addEventListener('touchstart', (e) => {
if (e.touches.length === 1) {
touchStartX = e.touches[0].clientX;
touchStartY = e.touches[0].clientY;
}
}, { passive: true });
stage.addEventListener('touchend', (e) => {
if (e.changedTouches.length !== 1) return;
const dx = e.changedTouches[0].clientX - touchStartX;
const dy = e.changedTouches[0].clientY - touchStartY;
if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) {
if (dx > 0) go(current - 1);
else go(current + 1);
}
}, { passive: true });

go(0);

let threeInited = false;
function initThree() {
if (threeInited) return;
threeInited = true;
const host = document.getElementById('three-host');
if (!host || !window.THREE) return;

setTimeout(() => {
const w = host.clientWidth, h = host.clientHeight;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
camera.position.z = 6.5;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(w, h);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
host.appendChild(renderer.domElement);

const coreGeo = new THREE.IcosahedronGeometry(1.5, 1);
const coreMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, wireframe: true, transparent: true, opacity: 0.35 });
const core = new THREE.Mesh(coreGeo, coreMat);
scene.add(core);

const glowGeo = new THREE.SphereGeometry(0.85, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({ color: 0xFF6B35, transparent: true, opacity: 0.25 });
const glow = new THREE.Mesh(glowGeo, glowMat);
scene.add(glow);

const agents = [];
const lineMat = new THREE.LineBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.1 });
const lines = [];

for (let i = 0; i < 14; i++) {
const isAccent = i % 3 === 0;
const g = new THREE.SphereGeometry(isAccent ? 0.09 : 0.06, 16, 16);
const m = new THREE.MeshBasicMaterial({ color: isAccent ? 0xFF6B35 : 0xA0A0AE });
const mesh = new THREE.Mesh(g, m);
const phase = (i / 14) * Math.PI * 2;
const radius = 2.4 + Math.random() * 0.8;
const tilt = (Math.random() - 0.5) * 0.9;
agents.push({ mesh, phase, radius, tilt, speed: 0.3 + Math.random() * 0.4 });
scene.add(mesh);

const lg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
const ln = new THREE.Line(lg, lineMat);
lines.push({ ln, agent: agents[i] });
scene.add(ln);
}

let mx = 0, my = 0;
const handlePointer = (clientX, clientY) => {
const r = host.getBoundingClientRect();
mx = ((clientX - r.left) / r.width) * 2 - 1;
my = ((clientY - r.top) / r.height) * 2 - 1;
};
host.addEventListener('mousemove', (e) => handlePointer(e.clientX, e.clientY));
host.addEventListener('touchmove', (e) => {
if (e.touches[0]) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

const start = performance.now();
function animate(now) {
const t = (now - start) / 1000;
core.rotation.x = t * 0.12 + my * 0.3;
core.rotation.y = t * 0.18 + mx * 0.4;
glow.scale.setScalar(1 + Math.sin(t * 1.5) * 0.06);

agents.forEach((a) => {
const ang = a.phase + t * a.speed;
a.mesh.position.x = Math.cos(ang) * a.radius;
a.mesh.position.z = Math.sin(ang) * a.radius;
a.mesh.position.y = Math.sin(ang * 0.7 + a.tilt * 4) * 0.9 + a.tilt;
});
lines.forEach(({ ln, agent }) => {
ln.geometry.setFromPoints([new THREE.Vector3(0,0,0), agent.mesh.position.clone()]);
});

renderer.render(scene, camera);
requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

const onResize = () => {
const W = host.clientWidth, H = host.clientHeight;
if (W === 0 || H === 0) return;
camera.aspect = W / H;
camera.updateProjectionMatrix();
renderer.setSize(W, H);
};
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));
}, 100);
}
</script>
